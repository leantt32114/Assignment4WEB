<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a train ticket</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body class="page-train">
<nav class="nav nav-underline justify-content-center py-2" aria-label="Tasks">
  <a class="nav-link active" href="task1.html" aria-current="page">Task 1</a>
  <a class="nav-link" href="task2.html">Task 2</a>
  <a class="nav-link" href="task3.html">Task 3</a>
</nav>
<main class="container py-4 py-md-5">
 <div class="row justify-content-center"><div class="col-12 col-md-10 col-lg-8 col-xl-7">
  <div class="ticket">
   <h1 class="ticket-head">Book a train ticket</h1>
   <form class="ticket-body" action="#" method="get">

    <div class="trip btn-group mb-3" role="group" aria-label="Trip type">
     <input type="radio" class="btn-check" name="trip" id="oneway" value="oneway" checked>
     <label class="btn" for="oneway">One way</label>
     <input type="radio" class="btn-check" name="trip" id="round" value="round">
     <label class="btn" for="round">Round trip</label>
    </div>

    <div class="row g-3 mb-3">
     <div class="col-12 col-md-6"><div class="form-floating">
      <input type="text" class="form-control" id="from" name="from" placeholder="From" value="Astana" required>
      <label for="from">From</label></div></div>
     <div class="col-12 col-md-6"><div class="form-floating">
      <input type="text" class="form-control" id="to" name="to" placeholder="To" value="Almaty" required>
      <label for="to">To</label></div></div>
    </div>

    <div class="row g-3 mb-3">
     <div class="col-12 col-md-4"><label class="form-label" for="dep">Departure</label>
      <input type="date" class="form-control" id="dep" name="departure" required></div>
     <div class="col-12 col-md-4"><label class="form-label" for="ret">Return</label>
      <input type="date" class="form-control" id="ret" name="return"></div>
     <div class="col-12 col-md-4"><label class="form-label" for="pax">Passengers</label>
      <select class="form-select" id="pax" name="passengers">
       <option value="1" selected>1 adult</option><option value="2">2 adults</option><option value="3">3 adults</option>
       <option value="4">4 adults</option><option value="5">5 adults</option><option value="6">6 adults</option>
      </select></div>
    </div>

    <fieldset class="mb-3">
     <legend>Carriage class</legend>
     <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="class" id="seat" value="seat" required>
      <label class="form-check-label" for="seat">Seat</label></div>
     <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="class" id="coupe" value="coupe" checked>
      <label class="form-check-label" for="coupe">Coupé</label></div>
     <div class="form-check form-check-inline"><input class="form-check-input" type="radio" name="class" id="sleeper" value="sleeper">
      <label class="form-check-label" for="sleeper">Sleeper</label></div>
    </fieldset>

    <div class="row g-3 mb-3">
     <div class="col-12 col-md-6"><label class="form-label" for="phone">Phone</label>
      <div class="input-group"><span class="input-group-text">+7</span>
       <input type="tel" class="form-control" id="phone" name="phone" placeholder="701 234 56 78" required></div></div>
     <div class="col-12 col-md-6"><label class="form-label" for="email">Email</label>
      <input type="email" class="form-control" id="email" name="email" placeholder="name@example.com" required></div>
    </div>

    <div class="form-check form-switch mb-1">
     <input class="form-check-input" type="checkbox" role="switch" id="sms" name="sms">
     <label class="form-check-label" for="sms">Also send the ticket by SMS</label></div>
    <div class="form-check mb-4">
     <input class="form-check-input" type="checkbox" id="agree" name="agree" required>
     <label class="form-check-label" for="agree">I agree with the carriage rules</label></div>

    <div class="d-flex flex-column-reverse flex-md-row justify-content-md-end gap-2">
     <button type="reset" class="btn btn-clear">Clear</button>
     <button type="submit" class="btn btn-find">Find trains</button>
    </div>
   </form>
  </div>
 </div></div>
</main>
</body>
</html>
